[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-drum-score-to-pdf"
version = "0.1.0"
description = "Automatic image-based drum score video conversion"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pillow==12.3.0", "numpy==2.5.3", "opencv-python-headless==5.0.0.93",
  "reportlab==5.0.1", "yt-dlp==2026.8.19",
]

[project.scripts]
drum-score = "drum_score.cli:main"

[tool.setuptools]
packages = ["drum_score"]
py-modules = ["video_seek", "public_video", "anonymous_network", "anonymous_backend"]
package-dir = {"drum_score" = "src/drum_score", "" = "skills/bilibili-drum-score-to-pdf/scripts"}
