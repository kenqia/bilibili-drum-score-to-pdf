[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-drum-score-to-pdf"
version = "0.1.1"
description = "Automatic image-based drum score video conversion"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pillow==12.3.0", "numpy==2.5.3", "opencv-python-headless==5.0.0.93",
  "reportlab==5.0.1", "yt-dlp==2026.10.21", "yt-dlp-ejs==0.8.0",
]

[project.optional-dependencies]
web = ["fastapi==0.156.8", "uvicorn==0.54.0"]

[project.scripts]
drum-score = "drum_score.cli:main"
drum-score-web = "drum_score.web:main"
drum-score-worker = "drum_score.worker:main"
drum-score-maintenance = "drum_score.maintenance:main"

[tool.setuptools]
packages = ["drum_score"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
drum_score = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.jpg"]
