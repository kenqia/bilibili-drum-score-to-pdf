name: Script and website verification

on:
  pull_request:
  push:
    branches: [main, 'integration/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Program regression (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/requirements-web.txt
      - name: Install video and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg poppler-utils fonts-dejavu-core
      - name: Install pinned Python dependencies
        id: dependencies
        run: python -m pip install ".[web]" -r tests/requirements-web.txt
      - name: Check product syntax
        run: |
          python -m pip install --quiet ruff==0.14.14
          ruff check --select E701,E702 src/drum_score
      - name: Run offline regression shard
        run: python ci/run_unittest_shard.py --index ${{ matrix.shard }} --count 2

  replay:
    name: Program synthetic replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install video and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg poppler-utils fonts-dejavu-core
      - name: Install pinned Python dependencies
        id: dependencies
        run: python -m pip install .
      - name: Verify synthetic script conversion and refusal cases
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python ci/verify_script_product.py --output work/ci-evidence
      - name: Retain bounded synthetic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/ci-evidence/summary.json
            work/ci-evidence/fixture-score.pdf
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false

  release:
    name: Committed release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build frontend
        run: python -m pip install build==1.6.1
      - name: Build and verify exact committed package payload
        run: python tools/build_release.py --commit HEAD --output work/release
      - name: Retain verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/release/
          retention-days: 7
          if-no-files-found: error

  windows-core:
    name: Program Windows contracts
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install native video and PDF tools
        timeout-minutes: 10
        run: python ci/install_windows_tools.py
      - name: Install pinned Python dependencies
        run: python -m pip install .
      - name: Verify supported CLI and media contracts
        shell: pwsh
        run: |
          $patterns = @('test_ci_windows_tools.py', 'test_cross_host.py', 'test_public_contracts.py')
          foreach ($pattern in $patterns) {
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python ci/verify_script_product.py --output work/windows-replay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
