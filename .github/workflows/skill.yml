name: Skill verification

on:
  pull_request:
  push:
    branches: [main, 'integration/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/bilibili-drum-score-to-pdf/scripts/requirements.txt
      - name: Install video and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg poppler-utils fonts-dejavu-core
      - name: Install pinned Python dependencies
        id: dependencies
        run: python -m pip install -r skills/bilibili-drum-score-to-pdf/scripts/requirements.txt
      - name: Check request and workflow syntax
        run: |
          python -m pip install --quiet ruff==0.14.14
          ruff check --select E701,E702 skills/bilibili-drum-score-to-pdf/scripts/score_task.py skills/bilibili-drum-score-to-pdf/scripts/score_workflow.py skills/bilibili-drum-score-to-pdf/scripts/convert.py skills/bilibili-drum-score-to-pdf/scripts/host_check.py
      - name: Run offline regression shard
        run: python ci/run_unittest_shard.py --tests tests/skill --index ${{ matrix.shard }} --count 2

  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/bilibili-drum-score-to-pdf/scripts/requirements.txt
      - name: Install video and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg poppler-utils fonts-dejavu-core
      - name: Install pinned Python dependencies
        id: dependencies
        run: python -m pip install -r skills/bilibili-drum-score-to-pdf/scripts/requirements.txt
      - name: Replay synthetic reconstruction and refusal cases
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python ci/verify_agent_replay.py --output work/ci-evidence
      - name: Retain bounded synthetic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/ci-evidence/summary.json
            work/ci-evidence/fixture-score.pdf
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false

  windows-core:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install native video and PDF tools
        timeout-minutes: 10
        run: python ci/install_windows_tools.py
      - name: Install pinned Python dependencies
        run: python -m pip install -r skills/bilibili-drum-score-to-pdf/scripts/requirements.txt
      - name: Verify native installation, Agent flow and shared contracts
        shell: pwsh
        run: |
          $patterns = @('test_ci_windows_tools.py', 'test_skill_install.py', 'test_host_check.py', 'test_cross_host.py', 'test_agent_source.py', 'test_public_contracts.py', 'test_stage_cli.py')
          foreach ($pattern in $patterns) {
            python -m unittest discover -s tests/skill -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/sync_skill_references.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/verify_agent_replay.py --output work/windows-replay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
