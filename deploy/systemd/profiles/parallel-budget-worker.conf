# Opt-in candidate for the 2026-10-23 schema-v2 restore. Do not auto-install.
# The shared memory limit protects the host; arbitrary heavy jobs can still fail.
[Unit]
Description=Bounded parallel drum score conversion worker

[Service]
StateDirectory=
WorkingDirectory=/var/lib/drum-score-restore/parallel-v2-20261023
ReadWritePaths=
ReadWritePaths=/var/lib/drum-score-restore/parallel-v2-20261023
ExecStart=
ExecStart=/srv/drum-score/current/venv/bin/drum-score-worker --data-root /var/lib/drum-score-restore/parallel-v2-20261023 --concurrency 8 --retention-seconds 86400 --diagnostic-seconds 3600 --diagnostic-mib 8 --min-free-mib 2048 --retained-mib 8192 --max-temp-mib 512 --timeout 1200 --max-input-mib 256 --max-rss-mib 512
MemoryHigh=896M
MemoryMax=1G
MemorySwapMax=0
CPUQuota=150%
CPUWeight=10
IOWeight=10
Nice=10
TasksMax=256
LimitNOFILE=1024
OOMPolicy=stop
