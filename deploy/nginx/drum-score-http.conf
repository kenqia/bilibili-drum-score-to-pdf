# Enable only this file while obtaining the independent drum.kenqia.top certificate.
# Keep existing sites first; use sites-enabled/zz-drum-score for this site.
server {
    listen 80;
    listen [::]:80;
    server_name drum.kenqia.top;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/drum-score-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 503;
    }
}
