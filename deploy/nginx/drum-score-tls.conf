# Replace the HTTP-only site after certificate issuance; do not enable both.
# Keep existing sites first; use sites-enabled/zz-drum-score for this site.
server {
    listen 80;
    listen [::]:80;
    server_name drum.kenqia.top;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/drum-score-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://drum.kenqia.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name drum.kenqia.top;
    ssl_certificate /etc/letsencrypt/live/drum.kenqia.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drum.kenqia.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }
}
